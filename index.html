<!doctype html>
<html lang="en">
  <head>
    <title>Jimmy's Diner</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Smythe&display=swap"
      rel="stylesheet"
    />

    <!-- Global CSS -->
    <link rel="stylesheet" href="src/css/index.css" />
    <link rel="stylesheet" href="src/css/utilities.css" />

    <!-- Blocks -->
    <link rel="stylesheet" href="src/css/blocks/header/header.css" />
    <link rel="stylesheet" href="src/css/blocks/menu/menu.css" />
    <link
      rel="stylesheet"
      href="src/css/blocks/product-card/product-card.css"
    />
    <link rel="stylesheet" href="src/css/blocks/order/order.css" />
    <link rel="stylesheet" href="src/css/blocks/btn/btn.css" />
    <link rel="stylesheet" href="src/css/blocks/checkout/checkout.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__inner container">
        <h1 class="header__title">Jimmy's Diner</h1>
        <p class="header__para">The best burgers and pizzas in town.</p>
      </div>
    </header>

    <main>
      <section class="menu" id="menu">
        <h2 class="menu__title sr-only">Menu</h2>
        <div class="menu__inner container">
          <ul class="menu__list reset-list" data-list></ul>
        </div>
      </section>

      <section class="order" id="order">
        <div class="order__inner container" data-inner>
          <h2 class="order__title">Your order</h2>
          <div class="order__summary">
            <ul class="order__items reset-list" data-items></ul>
            <div class="order__item" aria-live="polite">
              <h3 class="order__item-title">Total price:</h3>
              <p class="order__item-price" data-total-price></p>
            </div>
          </div>

          <button
            class="order__complete-btn btn"
            data-complete
            aria-haspopup="dialog"
          >
            Complete order
          </button>
        </div>
      </section>
    </main>

    <dialog class="checkout" id="checkout" aria-label="Checkout">
      <h2 class="checkout__title">Enter card details</h2>

      <form class="checkout__form" data-form>
        <label for="name" class="sr-only">Name:</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Enter your name"
          required
          pattern="[a-zA-Z\s]+"
          class="checkout__input"
        />
        <label for="card-num" class="sr-only">Card Number:</label>
        <input
          id="card-num"
          name="card-num"
          type="text"
          placeholder="Enter card number"
          required
          pattern="[0-9]+"
          class="checkout__input"
        />
        <label for="cvv" class="sr-only">CVV:</label>
        <input
          id="cvv"
          name="cvv"
          type="text"
          placeholder="Enter CVV"
          required
          pattern="[0-9]+"
          maxlength="3"
          class="checkout__input"
        />
        <button class="checkout__pay-btn btn">Pay</button>
      </form>
    </dialog>

    <script src="dist/scripts/index.js" type="module"></script>
  </body>
</html>
